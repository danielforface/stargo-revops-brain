name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install -r apps/api/requirements-dev.txt
      - name: Unit and contract tests (offline synthetic fixtures)
        run: pytest -q apps/api/tests
      - name: Syntax / compile checks
        run: python -m compileall -q apps/api
      - name: Ruff critical checks
        run: ruff check apps/api --select E4,E7,E9,F63,F7,F82
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        working-directory: apps/web
        run: npm run build
  windows-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install backend dependencies, including Windows IANA timezone database
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Validate Jerusalem time zone and backend tests on Windows
        run: python -m pytest -q apps/api/tests
      - name: Compile and lint on Windows
        run: |
          python -m compileall -q apps/api
          python -m ruff check apps/api --select E4,E7,E9,F63,F7,F82
